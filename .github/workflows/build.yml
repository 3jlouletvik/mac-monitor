name: Build macOS app

on:
  push:
    tags: ["v*"]          # runs when you push a tag like v2.1.0
  workflow_dispatch:       # and manually from the Actions tab

permissions:
  contents: write          # needed to attach files to a Release

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the app
        run: bash build_app.sh

      - name: Keep the zip as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacMonitor
          path: dist/MacMonitor.zip

      - name: Attach the zip to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MacMonitor.zip
